<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Cloud Project | IOSYSTEK</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://formspree.io/js/formbutton-v1.min.js" defer></script>
    <script>
            window.formbutton=window.formbutton||function(){(formbutton.q=formbutton.q||[]).push(arguments)};
            formbutton("submit", {action: "https://formspree.io/f/xeevarql"})
    </script>    
</head>
<body>
    <header>
        <a href="index.html" class="logo-container"><img src="assets/images/logo.svg" alt="IOSYSTEK Logo"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="talent-solutions.html">Talent</a>
            <a href="contact.html" class="btn btn-primary" style="padding: 10px 20px; color:white;">Contact</a>
        </nav>
    </header>
    <section class="hero" style='background-image: url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&q=80&w=1600");'>
        <div class="hero-content"><h1>Start Cloud Project</h1></div>
    </section>
<main class="section container">
    <div class="form-container">
        <form action="https://formspree.io/f/xeevarql" method="POST">
            <input type="hidden" name="Inquiry Type" value="Cloud Project">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required>
            </div>
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" name="company_name" required>
            </div>
            <div class="form-group">
                <label>Work Email</label>
                <input type="email" name="work_email" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone_number">
            </div>
            <div class="form-group">
                <label>Project Type</label>
                <select name="project_type" required>
                    <option>AWS Migration</option>
                    <option>Azure Migration</option>
                    <option>DevOps Automation</option>
                    <option>Data Platform</option>
                    <option>Security Hardening</option>
                    <option>AI Enablement</option>
                </select>
            </div>
            <div class="form-group">
                <label>Current Environment</label>
                <input type="text" name="current_environment" placeholder="Example: On premises VMware, AWS, Azure">
            </div>
            <div class="form-group">
                <label>Target Cloud</label>
                <select name="target_cloud">
                    <option>AWS</option>
                    <option>Azure</option>
                    <option>Google Cloud</option>
                    <option>Hybrid</option>
                    <option>Not Sure</option>
                </select>
            </div>
            <div class="form-group">
                <label>Estimated Timeline</label>
                <input type="text" name="estimated_timeline" placeholder="Example: 30 days, 90 days, 6 months">
            </div>
            <div class="form-group">
                <label>Budget Range</label>
                <select name="budget_range">
                    <option>Under $25,000</option>
                    <option>$25,000 to $50,000</option>
                    <option>$50,000 to $100,000</option>
                    <option>$100,000 to $250,000</option>
                    <option>$250,000+</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea name="message" rows="4" placeholder="Tell us about your project goals, scope, and timeline." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Start Project</button>

        </form>
    </div>
</main>
    <footer>
        <div class="container" style="display:flex; justify-content:space-between; flex-wrap:wrap;">
            <div style="max-width:400px;">
                <img src="assets/images/logo.svg" alt="IOSYSTEK Logo" style="height:50px; filter:invert(1); margin-bottom:20px;">
                <p style="opacity:0.7;">Premier technology consulting and niche staffing for government contractors and tech-driven enterprises.</p>
            </div>
            <div>
                <h4 style="margin-bottom:20px;">Quick Links</h4>
                <p><a href="services.html" style="color:white; opacity:0.7; text-decoration:none;">Our Services</a></p>
                <p><a href="talent-solutions.html" style="color:white; opacity:0.7; text-decoration:none;">Talent Solutions</a></p>
                <p><a href="contact.html" style="color:white; opacity:0.7; text-decoration:none;">Contact Us</a></p>
            </div>
        </div>
    </footer>
</body>
</html>
